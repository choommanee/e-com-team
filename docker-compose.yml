services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: "http://localhost:8080"
      OUTPUT_DIR: "/app/output"
      WORKER_COUNT: "3"
      # Switch to "real" and supply keys to go live:
      AI_MODE: "${AI_MODE:-mock}"
      BILLING_MODE: "${BILLING_MODE:-mock}"
      JWT_SECRET: "${JWT_SECRET:-change-me-please}"
      DATABASE_URL: "postgres://ecom:ecom@db:5432/ecom?sslmode=disable"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OPENAI_IMAGE_MODEL: "${OPENAI_IMAGE_MODEL:-gpt-image-1}"
      LEMONSQUEEZY_API_KEY: "${LEMONSQUEEZY_API_KEY:-}"
      LEMONSQUEEZY_STORE_ID: "${LEMONSQUEEZY_STORE_ID:-}"
      LEMONSQUEEZY_WEBHOOK_SECRET: "${LEMONSQUEEZY_WEBHOOK_SECRET:-}"
      LS_VARIANT_PRO: "${LS_VARIANT_PRO:-}"
      LS_VARIANT_BUSINESS: "${LS_VARIANT_BUSINESS:-}"
    volumes:
      - images:/app/output

volumes:
  pgdata:
  images:
